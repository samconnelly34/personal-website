<svg xmlns="http://www.w3.org/2000/svg" width="560" height="455" viewBox="0 0 560 455"><rect width="560" height="455" rx="7" fill="#faf9f5"/><text x="25" y="38" font-family="Arial" font-size="12" letter-spacing="2" fill="#7b8777">ILLUSTRATIVE COACHING REPORT</text><text x="25" y="75" font-family="Georgia" font-size="25" fill="#2b3029">Discovery conversation</text><text x="25" y="99" font-family="Arial" font-size="13" fill="#7c8078">Fictional example · Session 014</text><line x1="25" y1="119" x2="535" y2="119" stroke="#deded4"/><rect x="25" y="140" width="76" height="26" rx="3" fill="#e4ecdf"/><text x="38" y="158" font-family="Arial" font-size="12" fill="#47614b">KEEP</text><text x="119" y="157" font-family="Arial" font-size="16" fill="#2b3029">Clarifying the problem</text><text x="119" y="181" font-family="Arial" font-size="13" fill="#696f65">Asked for the business outcome before proposing a tool.</text><rect x="25" y="214" width="92" height="26" rx="3" fill="#f0e7d9"/><text x="38" y="232" font-family="Arial" font-size="12" fill="#87694a">CORRECT</text><text x="135" y="231" font-family="Arial" font-size="16" fill="#2b3029">Confirm success criteria</text><text x="135" y="255" font-family="Arial" font-size="13" fill="#696f65">The conversation moved to solutions before defining a metric.</text><rect x="25" y="288" width="90" height="26" rx="3" fill="#e2e8ed"/><text x="37" y="306" font-family="Arial" font-size="12" fill="#536d7d">DEVELOP</text><text x="133" y="305" font-family="Arial" font-size="16" fill="#2b3029">Frame the tradeoff</text><text x="133" y="329" font-family="Arial" font-size="13" fill="#696f65">Explain speed versus flexibility in plain language.</text><line x1="25" y1="352" x2="535" y2="352" stroke="#deded4"/><text x="25" y="382" font-family="Arial" font-size="12" letter-spacing="1" fill="#748273">NEXT DRILL</text><text x="25" y="409" font-family="Arial" font-size="15" fill="#2b3029">Open the next call with one measurable outcome question.</text></svg>