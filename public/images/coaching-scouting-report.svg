a design.</text><rect x="30" y="407" width="1060" height="118" rx="5" fill="#213d30"/><text x="52" y="438" class="tiny" fill="#bcd2b7">THIS WEEK'S DRILL</text><text x="52" y="475" font-size="20" font-weight="bold" fill="#fff">Before offering a solution, ask two questions about the existing process.</text><text x="52" y="503" class="sub" fill="#c5d7c3">Practice on the next discovery call. Review the result in the next film session.</text></svg>